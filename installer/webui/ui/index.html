<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>WaveForge 安装</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="fx"></canvas>
<div id="transition-layer" aria-hidden="true"></div>

<div id="app">
  <header id="titlebar">
    <div class="tb-left">
      <img class="tb-logo" id="tb-logo" alt="">
      <span class="tb-title" id="tb-title">WaveForge 澜音工坊 · 安装向导</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btn-lang" title="Language" aria-label="Language">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.8 8h12.4M8 1.8c-4.6 4-4.6 8.4 0 12.4M8 1.8c4.6 4 4.6 8.4 0 12.4" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
      <button class="tb-btn" id="btn-theme" title="切换深浅主题" aria-label="切换主题">
        <svg class="ic-moon" viewBox="0 0 16 16"><path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <svg class="ic-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1v1.8M8 13.2V15M1 8h1.8M13.2 8H15M3 3l1.3 1.3M11.7 11.7L13 13M13 3l-1.3 1.3M4.3 11.7L3 13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <div class="lang-menu hidden" id="lang-menu"></div>
      <button class="tb-btn" id="btn-min" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
      <button class="tb-btn tb-close" id="btn-close" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main id="stage">
    <!-- U1 卸载确认 -->
    <section class="page" id="page-uninstall">
      <div class="welcome-grid">
        <div class="hero">
          <div class="hero-logo-wrap">
            <span class="logo-glow un-glow"></span>
            <img id="un-logo" class="hero-logo" alt="">
          </div>
          <h1 class="hero-name un-title" id="un-title">卸载</h1>
          <div class="hero-chips">
            <span class="chip" id="un-dir"></span>
            <span class="chip" id="un-size"></span>
          </div>
        </div>
        <div class="welcome-side">
          <div class="un-warning" id="un-warning"></div>
          <div class="field-label" id="un-keep-label"></div>
          <div class="un-keep" id="un-keep-list"></div>
          <div class="welcome-actions">
            <button class="btn danger btn-xl" id="btn-uninstall-run"><span id="un-run-text"></span><small id="un-run-desc"></small></button>
            <button class="btn secondary btn-xl" id="btn-uninstall-cancel"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- U2 正在卸载（逐条删除） -->
    <section class="page" id="page-unprogress">
      <div class="unprog-head">
        <h2 class="page-title" id="unprog-title"></h2>
        <p class="page-sub" id="unprog-sub"></p>
      </div>
      <div class="bar un-bar"><div class="bar-fill" id="un-bar-fill"></div><div class="bar-stripes" id="un-bar-stripes"></div></div>
      <div class="progress-stats"><span id="un-stat-count"></span><span id="un-stat-cur"></span></div>
      <div class="un-log" id="un-log"></div>
    </section>

    <!-- U3 卸载完成 -->
    <section class="page" id="page-unfinish">
      <canvas id="un-confetti"></canvas>
      <div class="finish-hero unfinish-hero">
        <svg class="check-ring" viewBox="0 0 96 96"><circle class="ring" cx="48" cy="48" r="42"/><path class="tick" d="M30 50l13 13 24-28"/></svg>
        <h2 class="finish-title" id="unfinish-title"></h2>
        <p class="finish-sub" id="unfinish-sub"></p>
      </div>
      <div class="residue hidden" id="un-residue">
        <div class="field-label" id="un-residue-label"></div>
        <div class="residue-path" id="un-residue-path"></div>
        <p class="residue-note" id="un-residue-note"></p>
      </div>
      <div class="finish-cta"><button class="btn primary finish-run" id="btn-unfinish-close"></button></div>
    </section>

    <!-- ① 欢迎 -->
    <section class="page" id="page-welcome">
      <div class="welcome-grid">
        <div class="hero">
          <div class="hero-logo-wrap">
            <span class="logo-glow"></span>
            <img id="hero-logo" class="hero-logo" alt="">
          </div>
          <h1 class="hero-name">WaveForge<span class="hero-sub">澜音工坊</span></h1>
          <div class="hero-chips">
            <span class="chip" id="chip-version">v0.1.4</span>
            <span class="chip chip-upgrade hidden" id="chip-upgrade"></span>
          </div>
        </div>
        <div class="welcome-side">
          <button class="btn primary btn-xl" id="btn-quick">
            一键安装<small id="quick-desc"></small>
          </button>
          <button class="btn secondary btn-xl" id="btn-custom">自定义安装</button>
          <p class="welcome-foot" id="welcome-foot">继续安装即表示你已阅读并同意<a href="#" id="link-agreement">《安装许可与用户协议》</a></p>
        </div>
      </div>
    </section>

    <!-- ② 协议与声明 -->
    <section class="page" id="page-license">
      <div class="license-head">
        <h2 class="page-title" id="license-title">安装许可与用户协议</h2>
        <p class="page-sub" id="license-sub">请滚动阅读全部内容，这是使用本软件前你与我们之间的约定。</p>
      </div>
      <div class="license-box" id="license-box" tabindex="0">
        <div id="license-content"></div>
        <div class="license-fade"></div>
      </div>
      <div class="agree-row">
        <button class="checkbox" id="agree-check" disabled aria-label="同意协议">
          <svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="agree-text" id="agree-text">我已阅读并同意上述全部条款<em id="agree-hint">（滚动至底部后可勾选）</em></span>
      </div>
      <footer class="page-actions">
        <button class="btn ghost" id="btn-license-back">不同意，退出</button>
        <button class="btn primary" id="btn-license-next" disabled>同意并继续</button>
      </footer>
    </section>

    <!-- ③ 自定义选项 -->
    <section class="page" id="page-options">
      <h2 class="page-title" id="options-title">自定义安装</h2>
      <p class="page-sub" id="options-sub">“所有用户”会安装到 Program Files，并在开始安装时请求一次管理员授权。</p>

      <div class="opt-scroll">
        <div class="field-label" id="label-scope">安装范围</div>
        <div class="segmented" id="scope-seg">
          <button class="seg active" data-scope="current"><b>仅当前用户</b><i>无需管理员权限</i></button>
          <button class="seg" data-scope="all"><b>所有用户</b><i>需要管理员授权</i></button>
        </div>

        <div class="field-label" id="label-dir">安装目录</div>
        <div class="dir-row">
          <div class="dir-input-wrap"><input type="text" id="dir-input" spellcheck="false" autocomplete="off"></div>
          <button class="btn secondary btn-browse" id="btn-browse">浏览</button>
        </div>
        <div class="dir-msg" id="dir-msg"></div>

        <div class="field-label" id="label-disk">可用磁盘</div>
        <div class="drives" id="drives"></div>

        <div class="opt-row">
          <button class="switch on" id="shortcut-switch" role="switch" aria-checked="true" aria-label="创建桌面快捷方式"><span class="knob"></span></button>
          <span class="opt-text" id="opt-text">创建桌面快捷方式</span>
          <span class="space-summary" id="space-summary"></span>
        </div>
      </div>

      <footer class="page-actions">
        <button class="btn secondary" id="btn-options-back">返回</button>
        <button class="btn primary" id="btn-options-install">开始安装</button>
      </footer>
    </section>

    <!-- ④ 正在安装 -->
    <section class="page" id="page-progress">
      <div class="progress-grid">
        <div class="progress-left">
          <div class="percent-line"><span id="percent-num">0</span><i>%</i></div>
          <div class="phase-line" id="phase-line">
            <span class="phase done" data-ph="extract"><i class="ph-dot"></i>释放文件</span>
            <span class="phase" data-ph="finish"><i class="ph-dot"></i>收尾配置</span>
            <span class="phase" data-ph="done"><i class="ph-dot"></i>完成</span>
          </div>
        </div>
        <div class="progress-right">
          <div class="bar"><div class="bar-fill" id="bar-fill"></div><div class="bar-stripes"></div></div>
          <div class="progress-stats">
            <span id="stat-size">0 MB / 0 MB</span>
            <span id="stat-eta"></span>
          </div>
          <canvas id="sparkline" width="520" height="46"></canvas>
          <p class="install-target" id="install-target"></p>
        </div>
      </div>
      <footer class="page-actions">
        <button class="btn ghost" id="btn-install-cancel">取消安装</button>
      </footer>
    </section>

    <!-- ⑤ 完成 -->
    <section class="page" id="page-finish">
      <canvas id="confetti"></canvas>
      <div class="finish-hero">
        <svg class="check-ring" viewBox="0 0 96 96">
          <circle class="ring" cx="48" cy="48" r="42"/>
          <path class="tick" d="M30 50l13 13 24-28"/>
        </svg>
        <h2 class="finish-title" id="finish-title">安装完成</h2>
      </div>
      <div class="finish-cta">
        <button class="btn primary finish-run" id="btn-finish-run">立即体验 WaveForge</button>
      </div>
    </section>
  </main>
</div>

<div class="modal-mask hidden" id="modal-mask">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modal-title">确认退出安装？</h3>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button class="btn secondary" id="modal-no">继续安装</button>
      <button class="btn danger" id="modal-yes">退出</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<!-- 自绘目录浏览 -->
<div class="modal-mask hidden" id="pick-mask">
  <div class="pick-modal">
    <h3 id="pick-title-el">选择安装目录</h3>
    <div class="pick-crumbs" id="pick-crumbs"></div>
    <div class="pick-list" id="pick-list"></div>
    <div class="pick-new hidden" id="pick-new-row">
      <input type="text" id="pick-new-name" placeholder="新文件夹名称" spellcheck="false">
      <button class="btn secondary btn-sm" id="pick-new-ok">创建</button>
      <button class="btn ghost btn-sm" id="pick-new-cancel">取消</button>
    </div>
    <div class="pick-actions">
      <button class="btn ghost btn-sm" id="pick-up">上级</button>
      <button class="btn secondary btn-sm" id="pick-new">新建文件夹</button>
      <span class="pick-flex"></span>
      <button class="btn secondary btn-sm" id="pick-cancel">取消</button>
      <button class="btn primary btn-sm" id="pick-ok">选择此目录</button>
    </div>
  </div>
</div>

<script src="logo.js"></script>
<script src="agreement.js"></script>
<script src="i18n.js"></script>
<script src="host.js"></script>
<script src="intro.js"></script>
<script src="sound.js"></script>
<script src="app.js"></script>
</body>
</html>
